services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: switchboard_user
      POSTGRES_PASSWORD: switchboard_password
      POSTGRES_DB: switchboard_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U switchboard_user -d switchboard_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: always
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      DATABASE_URL: postgres://switchboard_user:switchboard_password@db:5432/switchboard_db?sslmode=disable
      JWT_SECRET: ${JWT_SECRET}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
